name: Repair Vercel Git commit metadata

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: vercel-authorized deployment trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create authorized deployment commit
        run: |
          git config user.name "waqas0324-dev"
          git config user.email "wasoboy23@gmail.com"
          git commit --allow-empty -m "chore: vercel-authorized deployment trigger"
          git push origin HEAD:main
